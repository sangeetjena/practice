[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observe-agent"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "langgraph>=1.1,<2", "langgraph-checkpoint-sqlite>=3,<4", "openai>=2,<3", "chromadb>=1,<2"]

[project.optional-dependencies]
cloud = ["SQLAlchemy>=2,<3", "psycopg[binary,pool]>=3,<4", "langgraph-checkpoint-postgres>=3,<4", "google-cloud-pubsub>=2,<3", "google-auth[requests]>=2,<3"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["observe_agent"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "observe_agent/data"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
