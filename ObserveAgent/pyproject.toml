[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observe-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "langgraph>=1.1,<2", "langgraph-checkpoint-sqlite>=3,<4", "openai>=2,<3", "chromadb>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["observe_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
