[project]
name = "stock-research"
version = "0.2.0"
description = "CrewAI stock prediction with local CSV memory"
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[google-genai]==1.15.23",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "yfinance>=0.2.65,<2",
    "filelock>=3,<5",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
db = ["asyncpg>=0.29,<1", "redis>=5,<7"]

[project.scripts]
kickoff = "stock_research.main:kickoff"
run_crew = "stock_research.main:kickoff"
plot = "stock_research.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_research"]

[tool.crewai]
type = "flow"
project_id = "fa1d371f-69f1-429c-9238-71b00a8b7f40"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs external services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
