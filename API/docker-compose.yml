# Default: three services; use docker-compose.legacy.yml for original extraction examples.
x-app: &app
  build: {context: ., dockerfile: Dockerfile.platform}
  image: api-platform:local
  env_file: .env
  restart: unless-stopped
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
    interval: 10s
    timeout: 3s
    retries: 10
x-env: &env
  OTEL_ENABLED: 'true'
  OTEL_TRACES_SAMPLER: always_on
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel:4318/v1/traces
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel:4318/v1/metrics
  CUSTOMERS_URL: http://customers:8000
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/bootstrap.py}
      POSTGRES_DB: lab
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab]
      interval: 5s
      timeout: 3s
      retries: 20
  seed:
    <<: *app
    restart: 'no'
    environment:
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres/lab
    command: [sh, -c, 'for name in orders customers products; do SERVICE_NAME=$$name python -m api_interview_lab.platform.seed || exit 1; done']
    depends_on:
      postgres: {condition: service_healthy}
  orders:
    <<: *app
    environment:
      <<: *env
      SERVICE_NAME: orders
      ROOT_PATH: /orders
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres/lab
    depends_on:
      seed: {condition: service_completed_successfully}
  customers:
    <<: *app
    environment:
      <<: *env
      SERVICE_NAME: customers
      ROOT_PATH: /customers
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres/lab
      FAULT_DELAY_MS: ${CUSTOMERS_DELAY_MS:-0}
      FAULT_FAIL: ${CUSTOMERS_FAIL:-false}
    depends_on:
      seed: {condition: service_completed_successfully}
  products:
    <<: *app
    environment:
      <<: *env
      SERVICE_NAME: products
      ROOT_PATH: /products
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres/lab
    depends_on:
      seed: {condition: service_completed_successfully}
  worker:
    <<: *app
    environment:
      SERVICE_NAME: orders
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres/lab
    command: [python, -m, api_interview_lab.platform.worker]
    healthcheck: {disable: true}
    depends_on:
      seed: {condition: service_completed_successfully}
  gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: ['./deploy/platform/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      orders: {condition: service_healthy}
      customers: {condition: service_healthy}
      products: {condition: service_healthy}
  otel:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ['--config=/etc/otel.yaml']
    volumes: ['./deploy/platform/otel.yaml:/etc/otel.yaml:ro']
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment: {COLLECTOR_OTLP_ENABLED: 'true'}
    ports: ['127.0.0.1:16686:16686']
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./deploy/platform/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/platform/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:9090:9090']
  observe-agent:
    build: {context: ../ObserveAgent, dockerfile: Dockerfile}
    image: observe-agent:local
    environment:
      OBSERVE_DB_PATH: /data/observe-agent.db
      PROMETHEUS_URL: http://prometheus:9090
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-128}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-rule}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1600}
      ACTION_MODE: ${ACTION_MODE:-dry_run}
      ACTION_ALLOWLIST: ${ACTION_ALLOWLIST:-}
      HTTP_ALLOWED_HOSTS: ${HTTP_ALLOWED_HOSTS:-}
      GITHUB_ALLOWED_REPOSITORIES: ${GITHUB_ALLOWED_REPOSITORIES:-}
      EMAIL_ALLOWED_RECIPIENTS: ${EMAIL_ALLOWED_RECIPIENTS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes: [observe-data:/data]
    ports: ['127.0.0.1:8090:8090']
    depends_on: [prometheus]
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ['--config.file=/etc/alertmanager.yml']
    volumes: ['./deploy/platform/alertmanager.yml:/etc/alertmanager.yml:ro']
    depends_on: [observe-agent]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/platform/grafana.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - ./deploy/platform/dashboards.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ./deploy/platform/dashboard.json:/var/lib/grafana/dashboards/commerce.json:ro
    ports: ['127.0.0.1:3000:3000']
volumes:
  pg-data:
  observe-data:
