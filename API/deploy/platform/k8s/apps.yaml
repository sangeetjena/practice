apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: api-platform
data:
  nginx.conf: "# Local VM gateway. Kubernetes can use this same proxy behind a cloud\
    \ L4 load balancer.\nevents {}\nhttp {\n  resolver kube-dns.kube-system.svc.cluster.local\
    \ valid=10s;\n  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;\n\
    \  server {\n    listen 8080;\n    server_tokens off;\n    client_max_body_size\
    \ 64k;\n    limit_req_status 429;\n    location = /health/live { access_log off;\
    \ return 200 'ok'; }\n    location ~ ^/(orders|customers|products)(/.*)$ {\n \
    \     limit_req zone=per_ip burst=60 nodelay;\n      set $backend $1.api-platform.svc.cluster.local;\n\
    \      set $rest $2;\n      # Keep scrape endpoints private even though service\
    \ probes are internal.\n      if ($rest = /metrics) { return 404; }\n      proxy_pass\
    \ http://$backend:8000$rest$is_args$args;\n      proxy_set_header Host $host;\n\
    \      proxy_set_header X-Forwarded-Proto $scheme;\n      proxy_connect_timeout\
    \ 2s;\n      proxy_read_timeout 5s;\n      proxy_next_upstream off;\n      proxy_redirect\
    \ ~^(/.*)$ /$backend$1;\n    }\n    location / { return 404; }\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: api-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: nginx:1.28-alpine
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/live
            port: 8080
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: api-platform
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: import-worker
  namespace: api-platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: import-worker}
  template:
    metadata:
      labels: {app: import-worker}
    spec:
      terminationGracePeriodSeconds: 70
      containers:
        - name: worker
          image: api-platform:local
          command: [python, -m, api_interview_lab.platform.worker]
          envFrom:
            - secretRef: {name: platform-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
