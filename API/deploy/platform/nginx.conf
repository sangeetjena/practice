# Local VM gateway. Kubernetes can use this same proxy behind a cloud L4 load balancer.
events {}
http {
  resolver 127.0.0.11 valid=10s;
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;
    limit_req_status 429;
    location = /health/live { access_log off; return 200 'ok'; }
    location ~ ^/(orders|customers|products)(/.*)$ {
      limit_req zone=per_ip burst=60 nodelay;
      set $backend $1;
      set $rest $2;
      # Keep scrape endpoints private even though service probes are internal.
      if ($rest = /metrics) { return 404; }
      proxy_pass http://$backend:8000$rest$is_args$args;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_next_upstream off;
      proxy_redirect ~^(/.*)$ /$backend$1;
    }
    location / { return 404; }
  }
}
