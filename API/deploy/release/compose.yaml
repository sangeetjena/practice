# API-only local stack. The separate ObserveAgent project keeps its existing Compose flow.
name: api-release
x-app: &app
  image: ${API_IMAGE:-api-platform:local}
  env_file: ${API_ENV_FILE:-../../.env}
  environment: &environment
    DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres/lab
    CUSTOMERS_URL: http://customers:8000
    OTEL_ENABLED: 'false'
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
    interval: 5s
    timeout: 3s
    retries: 24
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local .env required}
      POSTGRES_DB: lab
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab]
      interval: 5s
      timeout: 3s
      retries: 24
  seed:
    <<: *app
    restart: 'no'
    healthcheck: {disable: true}
    command: [sh, -c, 'for name in orders customers products; do SERVICE_NAME=$$name python -m api_interview_lab.platform.seed || exit 1; done']
    depends_on:
      postgres: {condition: service_healthy}
  orders:
    <<: *app
    environment:
      <<: *environment
      SERVICE_NAME: orders
      ROOT_PATH: /orders
    depends_on:
      seed: {condition: service_completed_successfully}
  customers:
    <<: *app
    environment:
      <<: *environment
      SERVICE_NAME: customers
      ROOT_PATH: /customers
    depends_on:
      seed: {condition: service_completed_successfully}
  products:
    <<: *app
    environment:
      <<: *environment
      SERVICE_NAME: products
      ROOT_PATH: /products
    depends_on:
      seed: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: [python, -m, api_interview_lab.platform.worker]
    healthcheck: {disable: true}
    depends_on:
      seed: {condition: service_completed_successfully}
  gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${API_PORT:-8080}:8080']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      orders: {condition: service_healthy}
      customers: {condition: service_healthy}
      products: {condition: service_healthy}
volumes:
  pg-data:
