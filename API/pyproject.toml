[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-interview-lab"
version = "0.2.0"
description = "Runnable Python API patterns for interview preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "prometheus-client>=0.21,<1",
  "strawberry-graphql[fastapi]>=0.246,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
api-server = "api_interview_lab.server.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/api_interview_lab"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
