replicaCount: 3
image:
  repository: docker.io/qdrant/qdrant
  tag: v1.19.1
  pullPolicy: IfNotPresent
podManagementPolicy: Parallel
config:
  cluster:
    enabled: true
    p2p:
      port: 6335
    consensus:
      tick_period_ms: 100
  service:
    enable_tls: false
service:
  type: ClusterIP
  ports:
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
      checksEnabled: true
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
      checksEnabled: false
    - name: p2p
      port: 6335
      targetPort: 6335
      protocol: TCP
      checksEnabled: false
persistence:
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  storageClassName: local-qdrant
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: qdrant