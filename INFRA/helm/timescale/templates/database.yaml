apiVersion: v1
kind: Secret
metadata:
  name: timescale-credentials
type: Opaque
stringData:
  password: {{ required "postgres.password must be provided through Terraform" .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: timescale
  labels:
    app.kubernetes.io/name: timescale
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: timescale
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescale
  labels:
    app.kubernetes.io/name: timescale
spec:
  serviceName: timescale
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timescale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescale
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescale-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, {{ .Values.postgres.database | quote }}]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, {{ .Values.postgres.database | quote }}]
            periodSeconds: 20
          volumeMounts:
            - name: timescale-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: timescale-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.storage }}
