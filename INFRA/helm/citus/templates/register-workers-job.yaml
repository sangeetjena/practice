apiVersion: batch/v1
kind: Job
metadata:
  name: citus-register-workers
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citus-register-workers
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: register-workers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: citus-credentials
                  key: password
          command: [/bin/bash, -ec]
          args:
            - |
              until pg_isready -h citus-coordinator -p 5432; do sleep 2; done
              for ordinal in $(seq 0 {{ sub (int .Values.worker.replicas) 1 }}); do
                host="citus-worker-${ordinal}.citus-worker.{{ .Release.Namespace }}.svc.cluster.local"
                until pg_isready -h "$host" -p 5432; do sleep 2; done
                psql -h citus-coordinator -p 5432 -v ON_ERROR_STOP=1 \
                  -c "SELECT citus_add_node('$host', 5432) WHERE NOT EXISTS (SELECT 1 FROM pg_dist_node WHERE nodename = '$host' AND nodeport = 5432);"
              done