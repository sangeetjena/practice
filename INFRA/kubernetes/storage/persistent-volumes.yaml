apiVersion: v1
kind: PersistentVolume
metadata:
  name: cassandra-node-0
spec:
  capacity:
    storage: 8Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-cassandra
  claimRef:
    namespace: cassandra
    name: data-cassandra-0
  hostPath:
    path: /data/cassandra/node-0
    type: DirectoryOrCreate
---
