apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workloads-to-postgres
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: citus-coordinator
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              infra.local/database-client: "true"
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workloads-to-cassandra
  namespace: cassandra
spec:
  podSelector:
    matchLabels:
