name: Stock data adapters

on:
  push:
    branches: [stock]
    paths:
      - 'stock/**'
      - 'INFRA/**'
      - '.github/workflows/stock-data.yml'
  pull_request:
    paths:
      - 'stock/**'
      - 'INFRA/**'
      - '.github/workflows/stock-data.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stock project
        run: python -m pip install -e 'stock[db,dev]'
      - name: Test provider and storage contracts
        run: python -m pytest stock/tests -q
      - name: Check infrastructure scripts
        run: bash -n INFRA/scripts/*.sh
      - uses: azure/setup-helm@v4
      - name: Validate database charts
        run: |
          helm lint INFRA/helm/timescale --set postgres.password=example-long-password
          helm lint INFRA/helm/redis --set password=example-long-password
