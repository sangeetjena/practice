name: ObserveAgent cloud integration
on:
  pull_request:
    paths: ['ObserveAgent/**', '.github/workflows/observe-agent-cloud.yml']
  push:
    branches: [master]
    paths: ['ObserveAgent/**', '.github/workflows/observe-agent-cloud.yml']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: observer, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: observer}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U observer -d observer" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: ObserveAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[cloud,dev]'
      - run: ruff check .
      - run: pytest
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://observer:ci-only-password@localhost:5432/observer
      - run: docker build -f Dockerfile.cloud -t observe-cloud:ci .
      - run: bash -n deploy/gcp/deploy.sh
